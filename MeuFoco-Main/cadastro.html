<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Foco - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #C8DFB7;
    --gold: #DECE89;
    --gold-input: #DECE88;
    --cream: #FFF8D7;
    --heading-olive: #BCAC68;
    --accent-red: #FF0000;
    --white: #FFFFFF;
  }


  * { box-sizing: border-box; margin: 0; padding: 0; }


  body {
    background: #EAF2E2;
    font-family: 'Nunito', sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px;
  }


  .notebook {
    position: relative;
    width: 100%;
    max-width: 1280px;
    min-height: 993px;
    background: var(--bg);
    border-radius: 30px;
    padding: 24px 26px 40px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }


  .topbar {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 67px;
  }


  .topbar .icon-square {
    position: absolute;
    left: 0;
    top: 0;
    width: 50px;
    height: 50px;
    background: var(--accent-red);
    border-radius: 8px;
  }


  .topbar h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 55px;
    line-height: 67px;
    color: var(--white);
    text-align: center;
  }


  .auth-panel {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 0.65fr) minmax(0, 1fr);
    border-radius: 20px;
    overflow: hidden;
    min-height: 780px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }


  .auth-left {
    background: var(--gold);
    border-radius: 30px 0 0 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 40px;
    gap: 28px;
  }


  .auth-left h2 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 48px;
    line-height: 1.15;
    color: var(--white);
  }


  .auth-left p {
    font-weight: 400;
    font-size: 22px;
    line-height: 1.3;
    color: var(--white);
    max-width: 380px;
  }


  .cta-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 32px;
    border: 1px solid var(--white);
    border-radius: 20px;
    font-weight: 400;
    font-size: 22px;
    color: var(--white);
    text-decoration: none;
    background: transparent;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }


  .cta-outline:hover {
    background: var(--white);
    color: var(--gold);
  }


  .auth-right {
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 56px;
    gap: 28px;
  }


  .auth-right h2 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 52px;
    line-height: 1.1;
    color: var(--heading-olive);
    text-align: center;
    margin-bottom: 8px;
  }


  form.signup-form {
    width: 100%;
    max-width: 505px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1;
  }


  .field {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    background: var(--gold-input);
    border-radius: 10px;
    padding: 18px 22px;
  }


  .field svg {
    flex: none;
    width: 26px;
    height: 26px;
    color: var(--cream);
  }


  .field input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 400;
    font-size: 20px;
    color: var(--cream);
  }


  .field input::placeholder {
    color: var(--cream);
    opacity: 0.9;
  }


  .submit-row {
    display: flex;
    justify-content: flex-end;
    margin-top: auto;
  }


  .submit-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 28px;
    background: var(--gold-input);
    border: 1px solid #DDCE8E;
    border-radius: 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: var(--cream);
    cursor: pointer;
    transition: filter 0.2s ease;
  }


  .submit-btn:hover { filter: brightness(0.95); }


  @media (max-width: 860px) {
    .auth-panel { grid-template-columns: 1fr; min-height: unset; }
    .auth-left { border-radius: 30px 30px 0 0; padding: 40px 24px; }
    .auth-right { padding: 40px 24px; }
    .auth-left h2 { font-size: 34px; }
    .auth-right h2 { font-size: 36px; }
    .topbar h1 { font-size: 34px; line-height: 40px; }
    .topbar .icon-square { width: 36px; height: 36px; }
  }
</style>
</head>
<body>


<div class="notebook">


  <header class="topbar">
    <div class="icon-square" aria-hidden="true"></div>
    <h1>Meu Foco</h1>
  </header>


  <section class="auth-panel">


    <div class="auth-left">
      <h2>Bem vindo(a)</h2>
      <p>Organize seus estudos, monte seu cronograma e não perca o foco. É novo aqui? Faça seu cadastro abaixo.</p>
      <a href="#form-cadastro" class="cta-outline">Cadastre-se</a>
    </div>


    <div class="auth-right">
      <h2>Faça seu login</h2>


      <form class="signup-form" id="form-cadastro">
        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M22 6l-10 7L2 6"/>
          </svg>
          <input type="email" name="email" placeholder="Email" required>
        </label>


        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input type="password" name="senha" placeholder="Senha" required>
        </label>


        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
          <input type="password" name="confirmar_senha" placeholder="Confirmar senha" required>
        </label>


        <div class="submit-row">
          <a href="index.html"><button type="submit" class="submit-btn">Fazer login</button></a>
        </div>
      </form>
    </div>


  </section>


</div>
<!--Eu nunca mais quero passar por isso, pela fé-->
</body>
</html>
