<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Foco - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="pagina pagina-login">
        <section class="card-login">
            <header class="cabecalho-login">
                <h1>Meu Foco</h1>
                <p>Organize seus estudos. Alcance seus objetivos.</p>
            </header>

            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" name="email" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" name="senha" autocomplete="current-password" required>
                </div>

                <p id="login-mensagem" class="mensagem" role="alert"></p>

                <button type="submit" class="botao botao-principal">Entrar</button>
            </form>

            <p class="link-alternativo">
                Ainda não possui uma conta?
                <a href="cadastro.html">Criar conta</a>
            </p>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
